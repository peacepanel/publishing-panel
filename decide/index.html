<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بطاقات الحسابات</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
  :root{--bg:#f4f5fb;--card:#fff;--ink:#1d2733;--muted:#6b7686;--line:#e3e6ee;--acc:#5b5bd6;--bad:#c0392b;--ok:#1a8a5a}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#15161c;--card:#1f2029;--ink:#eee;--muted:#a3a9b5;--line:#2e3040}}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;padding:16px}
  .wrap{max-width:640px;margin:0 auto}
  h1{font-size:20px;margin:4px 0}
  .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
  .c{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;transition:opacity .2s}
  .c.done{opacity:.55}
  .pg{font-size:13px;color:var(--acc);font-weight:800}
  .nm{font-size:19px;font-weight:800;margin:2px 0 8px}
  .row{font-size:13px;color:var(--muted);margin:3px 0}
  .row b{color:var(--ink);font-weight:600}
  .hint{font-size:13px;background:rgba(91,91,214,.08);border-radius:10px;padding:7px 10px;margin:8px 0}
  .ch{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}
  .ch button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:11px;padding:11px 4px;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
  .ch button.on{background:var(--acc);border-color:var(--acc);color:#fff}
  .ch button.x{grid-column:1/-1;color:var(--bad)}
  .ch button.x.on{background:var(--bad);border-color:var(--bad);color:#fff}
  .ch button.y{grid-column:1/-1;color:#b9770e}
  .ch button.y.on{background:#b9770e;border-color:#b9770e;color:#fff}
  .pgs{margin-top:10px;background:rgba(91,91,214,.06);border-radius:10px;padding:8px 10px}
  .pgs label{display:inline-flex;align-items:center;gap:5px;margin:4px 10px 4px 0;font-size:14px}
  .pgs input{width:auto;margin:0}
  input{width:100%;box-sizing:border-box;margin-top:8px;border:1px solid var(--line);border-radius:10px;padding:9px;font:inherit;font-size:14px;background:var(--bg);color:var(--ink)}
  .msg{color:var(--muted);text-align:center;padding:30px}
  .cnt{font-size:14px;margin-bottom:10px}
</style>
</head>
<body>
<div class="wrap">
  <h1>🗂️ بطاقات الحسابات</h1>
  <div class="sub">لكل حساب: اختار شنو هو. الجواب ينحفظ فوراً.</div>
  <div id="cnt" class="cnt"></div>
  <div id="list"><div class="msg">يحمّل…</div></div>
</div>
<script>
const sb=supabase.createClient('https://lxikqgjfjnfkhvuckihx.supabase.co','sb_publishable_9AKXuA_fvfQroYZDRDpRfQ_bYXfrxoT');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const OPT=[['rep','مندوبة'],['supervisor','مشرفة'],['assistant','مساعدة'],['admin','إدارة عامة'],['orders','متابعة طلبات'],['secure','تأمين حساب فقط'],['remove_page','↩️ طلّعها من هالصفحة بس'],['stranger','🚫 غريبة — تنشال من كل مكان']];
const ROLE=new Set(['rep','supervisor','assistant','admin','orders','secure']);
let rows=[];
function count(){const d=rows.filter(r=>r.answer).length;document.getElementById('cnt').textContent=`جاوبت ${d} من ${rows.length}`;}
function pagesBox(r,i){
  if(!ROLE.has(r.answer)) return '';
  const all=r.all_pages||[r.page]; const sel=new Set(r.pages||all);
  return `<div class="pgs"><div class="row">على أي صفحات؟</div>${all.map(p=>`<label><input type="checkbox" data-p="${i}" value="${esc(p)}" ${sel.has(p)?'checked':''}> ${esc(p)}</label>`).join('')}</div>`;
}
function card(r,i){return `
    <div class="pg">📄 ${esc(r.page)}</div>
    <div class="nm">👤 ${esc(r.meta)}</div>
    ${r.info?`<div class="row">مندوبات الصفحة بالانفو: <b>${esc(r.info)}</b></div>`:''}
    ${(r.all_pages||[]).length>1?`<div class="row">الحساب داخل على: <b>${esc(r.all_pages.join('، '))}</b></div>`:''}
    ${r.hint?`<div class="hint">${esc(r.hint)}</div>`:''}
    <div class="ch">${OPT.map(([k,l])=>`<button data-i="${i}" data-k="${k}" class="${k==='stranger'?'x ':k==='remove_page'?'y ':''}${r.answer===k?'on':''}">${l}</button>`).join('')}</div>
    ${pagesBox(r,i)}
    <input data-n="${i}" placeholder="ملاحظة (اختياري): مثلاً اسمها أو مساعدة منو" value="${esc(r.note||'')}">`;}
function render(){
  document.getElementById('list').innerHTML=rows.map((r,i)=>`<div class="c ${r.answer?'done':''}" id="c${i}">${card(r,i)}</div>`).join('')||'<div class="msg">ماكو بطاقات ✅</div>';
  count();
}
function selPages(i){const b=[...document.querySelectorAll(`[data-p="${i}"]`)];return b.length?b.filter(x=>x.checked).map(x=>x.value):null;}
async function save(i){const r=rows[i];
  const {error}=await sb.rpc('account_review_answer',{p_id:r.id,p_answer:r.answer,p_note:r.note||null,p_pages:r.pages||null});
  if(error) alert('ما انحفظ: '+error.message);}
async function load(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){document.getElementById('list').innerHTML='<div class="msg">لازم تسجل دخول أول من <a href="../monitor/">لوحة المراقبة</a> وبعدها ارجع.</div>';return;}
  const {data,error}=await sb.rpc('account_review_list');
  if(error){document.getElementById('list').innerHTML=`<div class="msg">خطأ: ${esc(error.message)}</div>`;return;}
  rows=data||[];render();
}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-k]');if(!b)return;const i=b.dataset.i,r=rows[i];
  r.note=document.querySelector(`[data-n="${i}"]`).value;r.answer=b.dataset.k;
  r.pages=ROLE.has(r.answer)?(r.pages||r.all_pages||[r.page]):null;
  const c=document.getElementById('c'+i);c.innerHTML=card(r,i);c.classList.add('done');count();await save(i);});
document.addEventListener('change',async e=>{
  const p=e.target.closest('[data-p]');if(p){const i=p.dataset.p;rows[i].pages=selPages(i);await save(i);return;}
  const n=e.target.closest('[data-n]');if(!n)return;const i=n.dataset.n;rows[i].note=n.value;if(rows[i].answer) await save(i);});
load();
</script>
</body>
</html>
